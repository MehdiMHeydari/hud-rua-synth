name: drawer_blind_store_astra
prompt: The drawer starts partly open. Put the yellow block inside the drawer and close the drawer.
# Astra variant of drawer_blind_store (Astra 1/5 at start 0.35): the drawer starts half open
# (9 cm strip for a 4 cm block), the version that scored sol 8/20.
objects:
  - {name: cabinet, shape: drawer, size: [0.25, 0.30, 0.14], color: wood, mass: 0.5,
     x: [0.62, 0.68], y: [-0.05, 0.1], yaw: [-15, 15], travel: 0.18, damping: 2.0, start: 0.5}
  - {name: block, shape: box, size: [0.04, 0.04, 0.04], color: yellow, x: [0.4, 0.48], y: [-0.38, -0.33]}
success:
  inside: {object: block, container: cabinet}
  closed: {object: cabinet, fraction: 0.05}
# Drop the block mid-strip (cabinet front at -0.125, drawer face at -0.215), then push the drawer
# shut on the tab's end with closed fingers (tab at -0.09 from its closed position).
oracle:
  - {at: block, offset: [0, 0, 0.15], gripper: open}
  - {at: block, gripper: open}
  - {at: block, gripper: closed}
  - {at: block, offset: [0, 0, 0.15], gripper: closed}
  - {at: cabinet, offset: [-0.17, 0, 0.20], gripper: closed}
  - {at: cabinet, offset: [-0.17, 0, 0.045], gripper: closed}
  - {at: cabinet, offset: [-0.17, 0, 0.045], gripper: open}
  - {at: cabinet, offset: [-0.17, 0, 0.20], gripper: open}
  - {at: cabinet.handle, offset: [-0.167, 0, 0.10], gripper: closed}
  - {at: cabinet.handle, offset: [-0.167, 0, 0], gripper: closed}
  - {at: cabinet.handle, offset: [-0.02, 0, 0], gripper: closed}
  - {at: cabinet.handle, offset: [-0.02, 0, 0.10], gripper: closed}
hidden: {closed.fraction: "'close the drawer' means shut; 5% (9 mm of 18 cm travel) only absorbs settling. Calibrated prompt, not reworded."}
knobs: {start: 0.5}
