name: stack_ordered
prompt: Stack the three cubes into one tower with the blue cube at the bottom, the red cube in the middle and the green cube on top. Leave the tower standing on its own.
objects:
  - {name: blue, shape: box, size: [0.045, 0.045, 0.045], color: blue, x: [0.45, 0.55], y: [-0.05, 0.05], yaw: [-45, 45]}
  - {name: red, shape: box, size: [0.045, 0.045, 0.045], color: red, x: [0.35, 0.45], y: [0.15, 0.25], yaw: [-45, 45]}
  - {name: green, shape: box, size: [0.045, 0.045, 0.045], color: green, x: [0.6, 0.7], y: [-0.25, -0.15], yaw: [-45, 45]}
success:
  stacked: {order: [blue, red, green]}
# Each cube is set down 5 mm above the one below (tcp at its centre) and let go; it turns with
# the bottom cube's yaw on the way, so faces line up.
oracle:
  - {at: red, offset: [0, 0, 0.15], gripper: open}
  - {at: red, gripper: open}
  - {at: red, gripper: closed}
  - {at: red, offset: [0, 0, 0.15], gripper: closed}
  - {at: blue, offset: [0, 0, 0.15], gripper: closed}
  - {at: blue, offset: [0, 0, 0.05], gripper: closed}
  - {at: blue, offset: [0, 0, 0.05], gripper: open}
  - {at: blue, offset: [0, 0, 0.15], gripper: open}
  - {at: green, offset: [0, 0, 0.15], gripper: open}
  - {at: green, gripper: open}
  - {at: green, gripper: closed}
  - {at: green, offset: [0, 0, 0.20], gripper: closed}
  - {at: blue, offset: [0, 0, 0.20], gripper: closed}
  - {at: blue, offset: [0, 0, 0.095], gripper: closed}
  - {at: blue, offset: [0, 0, 0.095], gripper: open}
  - {at: blue, offset: [0, 0, 0.20], gripper: open}
knobs: {blocks: 3, block_size: 0.045}
