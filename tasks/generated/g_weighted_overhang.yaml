  - {at: red, offset: [0.022, 0, 0.005], gripper: closed}
  - {at: red, offset: [0.022, 0, 0.25], gripper: closed}
  - {at: platform, offset: [0.170, 0, 0.30], yaw: 180, gripper: closed}
