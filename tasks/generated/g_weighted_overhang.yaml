name: g_weighted_overhang
prompt: >-
  Four 14 x 4 x 3 cm blocks start lying flat on the table: three blue and one red. Each one looks
  uniform but hides a lead weight inside one of its ends, and you cannot see which end. A white
  platform 8 cm tall stands on the table. Stack the blocks on the platform, with the red block on
  top, so that the red block sticks out at least 15 cm past the platform edge that faces the robot.
  Measure to the red block's farthest corner, horizontally from that edge. The red block must stay
  up above the platform's top on its own, released and at rest.
# Each block is 0.05 kg plus 0.10 kg of lead at its +x end. The platform is yawed 180 deg so its +x
# face, the one the overhang predicate measures from, faces the robot.
#
# The simulated COM offset is about 2.2 cm from centre toward the lead, not the intent's 4 cm. Red
# tipping points across v2-v4 put it at 1.7-2.3 cm: the lead geom sits about 3.3 cm out, not at the
# tip. Uniform blocks still top out at 14.6 cm (zero margin); heavy end inboard allows about 19 cm.
#
# Each block is grasped at its COM (+2.2 cm along its own x). Margins are sized to the placement
# scatter seen in v3-v4: about 1 cm per block, combined from both blocks at each joint.
# Margins: red on b3 2.0 cm; b3+red on b2 1.75; three on b1 1.6; whole stack on the platform 0.8.
# The last is a mean over 4 placements, so its scatter is smaller.
# Outward from the edge, centres are at -4.3, -1.7, +2.1 and +9.2 cm; the red corner reaches 16.2 cm.
# TCP platform-frame x offsets: 0.035, 0.061, 0.099, 0.170 (edge at 0.10).
# The platform origin is at table level. Blocks are grasped 5 mm above centre and released 7 mm
# above rest. Block friction 1.5 firms up the grip and stops skids on landing.
objects:
  - {name: platform, shape: platform, size: [0.20, 0.20, 0.08], color: white,
     x: [0.62, 0.66], y: [-0.03, 0.03], yaw: [175, 185]}
  - {name: b1, shape: box, size: [0.14, 0.04, 0.03], color: blue, mass: 0.05, weight: 0.10, friction: 1.5,
     x: [0.36, 0.40], y: [0.24, 0.29], yaw: [-180, 180]}
  - {name: b2, shape: box, size: [0.14, 0.04, 0.03], color: blue, mass: 0.05, weight: 0.10, friction: 1.5,
     x: [0.58, 0.62], y: [0.25, 0.30], yaw: [-180, 180]}
  - {name: b3, shape: box, size: [0.14, 0.04, 0.03], color: blue, mass: 0.05, weight: 0.10, friction: 1.5,
     x: [0.36, 0.40], y: [-0.29, -0.24], yaw: [-180, 180]}
  - {name: red, shape: box, size: [0.14, 0.04, 0.03], color: red, mass: 0.05, weight: 0.10, friction: 1.5,
     x: [0.58, 0.62], y: [-0.30, -0.25], yaw: [-180, 180]}
success:
  overhang: {object: red, platform: platform, beyond: 0.15}
oracle:
  # level 1: b1, centre 4.3 cm inboard of the edge
  - {at: b1, offset: [0.022, 0, 0.25], gripper: open}
  - {at: b1, offset: [0.022, 0, 0.005], gripper: open}
  - {at: b1, offset: [0.022, 0, 0.005], gripper: closed}
  - {at: b1, offset: [0.022, 0, 0.25], gripper: closed}
  - {at: platform, offset: [0.035, 0, 0.30], yaw: 180, gripper: closed}
  - {at: platform, offset: [0.035, 0, 0.16], yaw: 180, gripper: closed}
  - {at: platform, offset: [0.035, 0, 0.107], yaw: 180, gripper: closed}
  - {at: platform, offset: [0.035, 0, 0.107], yaw: 180, gripper: open}
  - {at: platform, offset: [0.035, 0, 0.30], yaw: 180, gripper: open}
  # level 2: b2, centre 1.7 cm inboard
  - {at: b2, offset: [0.022, 0, 0.25], gripper: open}
  - {at: b2, offset: [0.022, 0, 0.005], gripper: open}
  - {at: b2, offset: [0.022, 0, 0.005], gripper: closed}
  - {at: b2, offset: [0.022, 0, 0.25], gripper: closed}
  - {at: platform, offset: [0.061, 0, 0.30], yaw: 180, gripper: closed}
  - {at: platform, offset: [0.061, 0, 0.19], yaw: 180, gripper: closed}
  - {at: platform, offset: [0.061, 0, 0.137], yaw: 180, gripper: closed}
  - {at: platform, offset: [0.061, 0, 0.137], yaw: 180, gripper: open}
  - {at: platform, offset: [0.061, 0, 0.30], yaw: 180, gripper: open}
  # level 3: b3, centre 2.1 cm out
  - {at: b3, offset: [0.022, 0, 0.25], gripper: open}
  - {at: b3, offset: [0.022, 0, 0.005], gripper: open}
  - {at: b3, offset: [0.022, 0, 0.005], gripper: closed}
  - {at: b3, offset: [0.022, 0, 0.25], gripper: closed}
  - {at: platform, offset: [0.099, 0, 0.30], yaw: 180, gripper: closed}
  - {at: platform, offset: [0.099, 0, 0.22], yaw: 180, gripper: closed}
  - {at: platform, offset: [0.099, 0, 0.167], yaw: 180, gripper: closed}
