  - {at: platform, offset: [0.170, 0, 0.30], yaw: 180, gripper: open}
knobs: {blocks: 4, lead_kg: 0.10, block_mass: 0.05, beyond: 0.15, com_offset_design: 0.021, top_margin: 0.02, uniform_max: 0.146}
