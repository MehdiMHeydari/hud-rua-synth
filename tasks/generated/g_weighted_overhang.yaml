name: g_weighted_overhang
prompt: >-
  Four 14 x 4 x 3 cm blocks start lying flat on the table: three blue and one red. Each one looks
  uniform but hides a lead weight inside one of its ends, and you cannot see which end. A white
  platform 8 cm tall stands on the table. Stack the blocks on the platform, with the red block on
  top, so that the red block sticks out at least 15 cm past the platform edge that faces the robot.
  Measure to the red block's farthest corner, horizontally from that edge. The red block must stay
  up above the platform's top on its own, released and at rest.
# Each block is 0.05 kg plus 0.10 kg of lead at its +x end. The platform is yawed 180 deg so its +x
# face (the one the overhang predicate measures from) faces the robot. The simulated COM sits about
# 2.1-2.3 cm from centre toward the lead; red tipping points across v2-v5 put it there. Uniform blocks
# top out at 14.6 cm (zero margin); heavy end inboard allows about 19 cm.
# v6 fixes two failures:
#  - b3 was thrown off the stack sideways in seeds 0 and 2 of every version, a weak grip near the
#    arm's inner reach. b1 and b3 now start at x 0.42-0.46 and b2 and red at x 0.64-0.68.
#  - In seed 4 robust, red still tipped off b3's end. Red now sits 4 mm further in: top margin 2.4 cm,
#    corner 15.8 cm. That corner margin is never the failing check.
# Outward from the edge, block centres are at -4.3, -1.7, +2.1 and +8.8 cm, heavy ends inboard.
# With a 2.1 cm COM offset the margins are: red on b3 2.4 cm, b3+red on b2 1.95, three on b1 1.73,
# whole stack on the platform 0.88.
# Each block is grasped at its COM (+2.2 cm along its own x, 5 mm above centre). Placement uses tool
# yaw = platform yaw + 180. TCP platform-frame x offsets are 0.035, 0.061, 0.099 and 0.166, with the
# edge at 0.10. The platform origin is at table level, so z offsets are heights. Release is 7 mm
# above rest. Block friction 1.5 firms up the grip and stops skids on landing.
objects:
  - {name: platform, shape: platform, size: [0.20, 0.20, 0.08], color: white,
     x: [0.62, 0.66], y: [-0.03, 0.03], yaw: [175, 185]}
  - {name: b1, shape: box, size: [0.14, 0.04, 0.03], color: blue, mass: 0.05, weight: 0.10, friction: 1.5,
     x: [0.42, 0.46], y: [0.24, 0.29], yaw: [-180, 180]}
  - {name: b2, shape: box, size: [0.14, 0.04, 0.03], color: blue, mass: 0.05, weight: 0.10, friction: 1.5,
     x: [0.64, 0.68], y: [0.25, 0.30], yaw: [-180, 180]}
  - {name: b3, shape: box, size: [0.14, 0.04, 0.03], color: blue, mass: 0.05, weight: 0.10, friction: 1.5,
     x: [0.42, 0.46], y: [-0.29, -0.24], yaw: [-180, 180]}
  - {name: red, shape: box, size: [0.14, 0.04, 0.03], color: red, mass: 0.05, weight: 0.10, friction: 1.5,
     x: [0.64, 0.68], y: [-0.30, -0.25], yaw: [-180, 180]}
success:
  overhang: {object: red, platform: platform, beyond: 0.15}
oracle:
  # level 1: b1, centre 4.3 cm inboard of the edge
  - {at: b1, offset: [0.022, 0, 0.25], gripper: open}
  - {at: b1, offset: [0.022, 0, 0.005], gripper: open}
  - {at: b1, offset: [0.022, 0, 0.005], gripper: closed}
  - {at: b1, offset: [0.022, 0, 0.25], gripper: closed}
