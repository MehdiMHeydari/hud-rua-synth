name: loose_drawer
prompt: >-
  The drawer of the small cabinet starts closed. Open it by pulling its handle until the drawer is at least 90% of the
  way out. The cabinet is not fixed to the table. When you finish, the cabinet must be no more than
  5 cm from where it started. Leave everything released and at rest.
objects:
  - {name: cabinet, shape: drawer, size: [0.25, 0.30, 0.14], color: wood, mass: 0.2, loose: true,
     x: [0.62, 0.68], y: [-0.1, 0.1], yaw: [-15, 15], travel: 0.18, damping: 3.0}
  - {name: weight, shape: box, size: [0.06, 0.06, 0.06], color: black, mass: 1.0, friction: 2.0,
     x: [0.38, 0.42], y: [0.20, 0.25]}
success:
  opened: {object: cabinet, fraction: 0.9}
  unmoved: {objects: [cabinet], tol: 0.05}
# Pulling alone drags the cabinet with the drawer (slide resistance > the light cabinet's grip on the
# table). Weighting it down with the 1 kg block anchors it; bracing is the whole task.
oracle:
  - {at: weight, offset: [0, 0, 0.12], gripper: open}
  - {at: weight, gripper: open}
  - {at: weight, gripper: closed}
  - {at: weight, offset: [0, 0, 0.20], gripper: closed}
  - {at: cabinet, offset: [0.03, 0, 0.25], gripper: closed}
  - {at: cabinet, offset: [0.03, 0, 0.175], gripper: closed}
  - {at: cabinet, offset: [0.03, 0, 0.175], gripper: open}
  - {at: cabinet, offset: [0.03, 0, 0.30], gripper: open}
  - {at: cabinet.handle, offset: [0, 0, 0.10], gripper: open}
  - {at: cabinet.handle, gripper: open}
  - {at: cabinet.handle, gripper: closed}
  - {at: cabinet.handle, offset: [-0.21, 0, 0], gripper: closed}
  - {at: cabinet.handle, offset: [-0.21, 0, 0], gripper: open}
knobs: {cabinet_kg: 0.15, cabinet_friction: 0.25, damping: 3.0, weight_kg: 1.0}
