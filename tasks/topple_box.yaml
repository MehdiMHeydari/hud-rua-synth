name: topple_box
prompt: >-
  The tall orange box (9 x 9 x 20 cm) stands upright and is too wide to grasp. Tip it over so it lies on
  its side with its centre within 4 cm of the green circle's centre. Leave it released and at rest.
objects:
  - {name: box, shape: box, size: [0.09, 0.09, 0.20], color: orange, mass: 0.4, x: [0.44, 0.46], y: [-0.01, 0.01]}
  - {name: goal, shape: zone, size: [0.12], color: green, x: [0.695, 0.715], y: [-0.01, 0.01]}
# Measured: closed fingers pushing 15 cm up tip it (sliding needs a push below ~4.5 cm = half-width / mu),
# and its centre lands ~15 cm along the push. The circle is 25 cm away, so the lying box (still too
# wide to grasp) must then be pushed ~10 cm more: random flailing tipped it into a circle at 15 cm
# (trivial gate). layout_yaw puts the circle on most sides, so the push direction must be read from
# the scene (not straight back: pushing toward the robot from 0.8 m was out of reach).
layout_yaw: [-110, 110]
success:
  tipped: {object: box, angle: 70}
  in_zone: {object: box, zone: goal, radius: 0.04}
oracle:
# Offsets are from the box's centre (10 cm up): the push runs 15 cm above the table.
  - {at: box, toward: goal, offset: [-0.09, 0, 0.15], gripper: closed}
  - {at: box, toward: goal, offset: [-0.09, 0, 0.05], gripper: closed}
  - {at: box, toward: goal, offset: [0.02, 0, 0.05], gripper: closed}
  - {at: box, toward: goal, offset: [-0.05, 0, 0.20], gripper: closed}
# Then from where it stood (its lying rear end is ~5 cm ahead), push it along low.
  - {at: box, toward: goal, offset: [-0.02, 0, -0.07], gripper: closed}
  - {at: box, toward: goal, offset: [0.12, 0, -0.07], gripper: closed}
  - {at: box, toward: goal, offset: [0.08, 0, 0.10], gripper: closed}
knobs: {goal_distance_cm: 25, push_height_cm: 15, box: "9x9x20"}
