name: peg_in_hole_astra
prompt: The blue peg starts standing in the hole of the white block. Put the red peg into that hole.
# Astra variant of peg_in_hole (Astra 4/5): the hole starts occupied, so the agent must notice
# it, pull the blue peg out and set it aside before inserting the red one (a hole fits one peg).
# Rejected: a peg lying on its side. A top-down grasp keeps its long axis horizontal and nothing
# in the scene can tip it upright, so it couldn't be inserted without new wrist-pitch primitives.
objects:
  - {name: peg, shape: box, size: [0.03, 0.03, 0.06], color: red, x: [0.38, 0.48], y: [-0.2, -0.1], yaw: [20, 70]}
  - {name: holder, shape: hole_block, size: [0.12, 0.12, 0.04], hole: 0.0415, color: white,
     x: [0.55, 0.55], y: [0.12, 0.12]}
  # Taller than the red peg so 4 cm stands out of the hole to grip; same xy as the holder.
  - {name: plug, shape: box, size: [0.03, 0.03, 0.08], color: blue, x: [0.55, 0.55], y: [0.12, 0.12], yaw: [-10, 10]}
# Holder and plug move together: the layout turns about its centre, so the hole's place varies per seed.
layout_yaw: [-30, 30]
success:
  inserted: {object: peg, target: holder, depth: 0.02}
# Pinch the plug 2.5 cm above its centre (1.5 cm below its top), lift it clear, stand it 15 cm to
# the holder's side, then peg_in_hole's insertion.
oracle:
  - {at: plug, offset: [0, 0, 0.15], gripper: open}
  - {at: plug, offset: [0, 0, 0.025], gripper: open}
  - {at: plug, offset: [0, 0, 0.025], gripper: closed}
  - {at: plug, offset: [0, 0, 0.15], gripper: closed}
  - {at: holder, offset: [0, 0.15, 0.15], gripper: closed}
  - {at: holder, offset: [0, 0.15, 0.075], gripper: closed}
  - {at: holder, offset: [0, 0.15, 0.075], gripper: open}
  - {at: holder, offset: [0, 0.15, 0.15], gripper: open}
  - {at: peg, offset: [0, 0, 0.15], gripper: open}
  - {at: peg, offset: [0, 0, 0.005], gripper: open}
  - {at: peg, offset: [0, 0, 0.005], gripper: closed}
  - {at: peg, offset: [0, 0, 0.15], gripper: closed}
  - {at: holder, offset: [0, 0, 0.15], gripper: closed}
  - {at: holder, offset: [0, 0, 0.065], gripper: closed}
  - {at: holder, offset: [0, 0, 0.065], gripper: open}
  - {at: holder, offset: [0, 0, 0.15], gripper: open}
hidden: {inserted.depth: "A released peg drops to the table inside the 4 cm block, so 2 cm only rejects a peg jammed on the rim, which 'into the hole' already excludes."}
knobs: {clearance_mm: 11.5, hole_occupied: 1, layout_yaw_deg: 30}
