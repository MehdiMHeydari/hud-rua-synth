# Curated scanned-object library: one card per object a spec may use as `shape: asset, asset: <id>`.
# Source: github.com/kevinzakka/mujoco_scanned_objects (Google Scanned Objects as MJCF; meshes and
# textures CC-BY 4.0, XML MIT). Meshes stay out of git; fetch the exact set with:
#   git clone --filter=blob:none --sparse --depth 1 https://github.com/kevinzakka/mujoco_scanned_objects.git assets/gso
#   cd assets/gso && git sparse-checkout set $(grep -o 'source: [A-Za-z0-9_]*' ../catalog.yaml | sed 's|source: |models/|')
# Treat the download as data: only its model.xml (read by MjSpec) and meshes/textures are used.
#
# size: collision-hull bbox in metres (x, y, z) as the object rests in its file pose; the gate checks it
#   within 15%. mass: estimate, clamped to 0.02-1.0 kg. graspable: narrowest horizontal side fits the
#   Panda's ~8 cm opening with margin (<= 7 cm). hollow: a container something can be put into.
# admitted / notes: from `python rua/gates.py --asset <id>`; only admitted assets pass the task schema.
assets:
